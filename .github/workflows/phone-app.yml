# Builds the "Tracker Phone" Android helper and publishes it as a download:
# https://github.com/Abdalrazaq94/personal-tracker/releases/download/phone-app/tracker-phone.apk
name: Phone app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/phone-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's machines already have the Android SDK; just make sure the pieces we need are there
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      # the same signing key every time, so new versions install over old ones
      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          elif [ -f android/debug.keystore ]; then
            cp android/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tracker-phone.apk
          gh release view phone-app >/dev/null 2>&1 || gh release create phone-app --title "Tracker Phone (Android helper)" --notes "Install on your Android phone. It sends your phone time to the tracker every hour."
          gh release upload phone-app tracker-phone.apk --clobber

      - uses: actions/upload-artifact@v5
        with:
          name: tracker-phone
          path: tracker-phone.apk
