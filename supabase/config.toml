# Used only if you deploy with the Supabase CLI (npx supabase functions deploy ai).
# The function checks the signed-in user itself, so the gateway JWT check is turned off.
# This also makes it work with the newer "publishable" API keys.
[functions.ai]
verify_jwt = false

# Google Wallet auto-add: protected by the user's private token, not a login.
[functions.ingest]
verify_jwt = false
